<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Mood Booster - Lanjut Lirik Lagu</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        color: white;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      }

      .subtitle {
        font-size: 1.2rem;
        opacity: 0.9;
      }

      .game-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
        margin-bottom: 30px;
      }

      @media (max-width: 768px) {
        .game-area {
          grid-template-columns: 1fr;
        }
      }

      .music-player,
      .soundboard {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 25px;
        border-radius: 15px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .section-title {
        font-size: 1.5rem;
        margin-bottom: 20px;
        text-align: center;
        border-bottom: 2px solid rgba(255, 255, 255, 0.3);
        padding-bottom: 10px;
      }

      .song-info {
        margin-bottom: 20px;
        text-align: center;
      }

      .song-title {
        font-size: 1.3rem;
        margin-bottom: 5px;
      }

      .song-artist {
        font-size: 1rem;
        opacity: 0.8;
      }

      .lyrics-container {
        background-color: rgba(0, 0, 0, 0.2);
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        min-height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 1.2rem;
        line-height: 1.5;
      }

      .controls {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-top: 20px;
      }

      button {
        background-color: #ff4081;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 50px;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      button:hover {
        background-color: #e91e63;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
      }

      button:active {
        transform: translateY(0);
      }

      .stop-btn {
        background-color: #f44336;
      }

      .stop-btn:hover {
        background-color: #d32f2f;
      }

      .soundboard-buttons {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }

      .sound-btn {
        background-color: #4caf50;
        padding: 15px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }

      .sound-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
      }

      .sound-btn:active {
        transform: translateY(0);
      }

      .sound-btn.laugh {
        background-color: #ff9800;
      }

      .sound-btn.correct {
        background-color: #4caf50;
      }

      .sound-btn.wrong {
        background-color: #f44336;
      }

      .sound-btn.clap {
        background-color: #2196f3;
      }

      .sound-icon {
        font-size: 2rem;
        margin-bottom: 8px;
      }

      .sound-label {
        font-size: 1rem;
        font-weight: 500;
      }

      .progress-container {
        width: 100%;
        height: 8px;
        background-color: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        margin: 20px 0;
        overflow: hidden;
      }

      .progress-bar {
        height: 100%;
        background-color: #ff4081;
        width: 0%;
        transition: width 0.1s linear;
      }

      .song-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 15px;
        margin-top: 20px;
      }

      .song-item {
        background-color: rgba(255, 255, 255, 0.1);
        padding: 15px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
        text-align: center;
      }

      .song-item:hover {
        background-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-3px);
      }

      .song-item.active {
        background-color: rgba(255, 64, 129, 0.3);
        border: 2px solid #ff4081;
      }

      footer {
        text-align: center;
        margin-top: 30px;
        padding: 20px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 15px;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>

            </div>
            <div class="song-artist" id="current-song-artist">-</div>
          </div>

          <div class="lyrics-container" id="lyrics-display">
            Pilih lagu untuk melihat lirik dan melanjutkannya
          </div>

          <div class="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
          </div>

          <div class="controls">
            <button id="play-btn">Putar</button>
            <button id="stop-btn" class="stop-btn">Berhenti</button>
            <button id="next-btn">Lagu Selanjutnya</button>
          </div>

          <div style="text-align: center; margin-top: 20px">
            <label for="seek-input">Lompat ke detik:</label>
            <input
              type="number"
              id="seek-input"
              placeholder="Masukkan detik..."
              min="0"
            />
            <button id="seek-btn" type="button">Lompat</button>
          </div>

          <h3 class="section-title" style="margin-top: 30px">Daftar Lagu</h3>
          <div class="song-list" id="song-list"></div>
        </div>

        <div class="soundboard">
          <h2 class="section-title">Soundboard</h2>
          <div class="soundboard-buttons">
            <div class="sound-btn laugh" data-sound="laugh">
              <div class="sound-icon">😂</div>
              <div class="sound-label">Ketawa</div>
            </div>
            <div class="sound-btn correct" data-sound="correct">

              <div class="sound-label">Benar</div>
            </div>
            <div class="sound-btn wrong" data-sound="wrong">
              <div class="sound-icon">❌</div>
              <div class="sound-label">Salah</div>
            </div>
            <div class="sound-btn clap" data-sound="clap">
              <div class="sound-icon">👏</div>
              <div class="sound-label">Tepuk Tangan</div>
            </div>
          </div>
        </div>
      </div>

      <footer>
        <p>Game Mood Booster - Lanjut Lirik Lagu © 2023</p>
      </footer>
    </div>

        },
        {
          id: 30,

          title: "Lagu 30",
          artist: "Artis 30",
          lyrics: "Detik 31",
          audioUrl: "lagu/Soulmate.mp3",
        },
      ];

      // ======== ELEMENT DOM ========
      const songListElement = document.getElementById("song-list");
      const currentSongTitle = document.getElementById("current-song-title");
      const currentSongArtist = document.getElementById("current-song-artist");
      const lyricsDisplay = document.getElementById("lyrics-display");
      const playBtn = document.getElementById("play-btn");
      const stopBtn = document.getElementById("stop-btn");
      const nextBtn = document.getElementById("next-btn");
      const seekBtn = document.getElementById("seek-btn");
      const seekInput = document.getElementById("seek-input");
      const progressBar = document.getElementById("progress-bar");
      const soundButtons = document.querySelectorAll(".sound-btn");

      let currentSongIndex = 0;
      let isPlaying = false;
      let audio = new Audio();

      // ======== FUNGSI ========
      function initializeSongList() {
        songListElement.innerHTML = "";
        songs.forEach((song, index) => {
          const item = document.createElement("div");
          item.className = "song-item";
          if (index === currentSongIndex) item.classList.add("active");
          item.innerHTML = `<div>${song.title}</div><div style="font-size:0.8rem;opacity:0.8;">${song.artist}</div>`;
          item.addEventListener("click", () => selectSong(index));
          songListElement.appendChild(item);
        });
      }

      function selectSong(index) {
        currentSongIndex = index;
        updateActiveSong();
        loadSong(songs[currentSongIndex]);
        stopAudio();
      }

      function updateActiveSong() {
        document.querySelectorAll(".song-item").forEach((item, i) => {
          item.classList.toggle("active", i === currentSongIndex);
        });
      }

      function loadSong(song) {
        currentSongTitle.textContent = song.title;
        currentSongArtist.textContent = song.artist;
        lyricsDisplay.textContent = song.lyrics;
        audio.src = song.audioUrl;
        progressBar.style.width = "0%";
        audio.onloadedmetadata = () => {
          audio.currentTime = song.startTime || 0;
          audio.play();
        };
      }

      function playAudio() {
        if (audio.src) {
          audio.play();
          isPlaying = true;
          playBtn.textContent = "Jeda";
          updateProgressBar();
        }
      }

      function stopAudio() {
        audio.pause();
        audio.currentTime = 0;
        isPlaying = false;
        playBtn.textContent = "Putar";
        progressBar.style.width = "0%";
      }

      function togglePlayPause() {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          playBtn.textContent = "Putar";
        } else {
          playAudio();
        }
      }

      function nextSong() {
        currentSongIndex = (currentSongIndex + 1) % songs.length;
        updateActiveSong();
        loadSong(songs[currentSongIndex]);
        playAudio();
      }

      function updateProgressBar() {
        if (isPlaying && audio.duration > 0) {
          const progress = (audio.currentTime / audio.duration) * 100;
          progressBar.style.width = `${progress}%`;
          if (audio.currentTime < audio.duration) {
            requestAnimationFrame(updateProgressBar);
          } else {
            nextSong();
          }
        }
      }

      // ======== FUNGSI LOMPAT ========
      function seekToSecond() {
        const seconds = parseFloat(seekInput.value);
        if (!isNaN(seconds) && seconds >= 0 && audio.duration > seconds) {
          audio.currentTime = seconds;
          if (!isPlaying) playAudio();
        } else {
          alert(
            "Masukkan detik yang valid (0 - " + Math.floor(audio.duration) + ")"
          );
        }
      }

      // ======== SOUND EFFECT ========
      function playSound(type) {
        const sound = document.getElementById(`sound-${type}`);
        if (sound) {
          sound.currentTime = 0;
          sound.play();
        }
      }

      // ======== EVENT LISTENERS ========
      playBtn.addEventListener("click", togglePlayPause);
      stopBtn.addEventListener("click", stopAudio);
      nextBtn.addEventListener("click", nextSong);
      seekBtn.addEventListener("click", seekToSecond);
      soundButtons.forEach((btn) =>
        btn.addEventListener("click", () => playSound(btn.dataset.sound))
      );

      // ======== INISIALISASI ========
      initializeSongList();
      loadSong(songs[currentSongIndex]);
